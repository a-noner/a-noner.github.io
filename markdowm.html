<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智谱清言搜题（Markdown + 数学公式版）</title>

    <!-- Marked：Markdown 解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- KaTeX 核心 CSS 和 JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- KaTeX 自动渲染扩展（识别 $...$ 和 $$...$$） -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            max-width: 700px;
            width: 100%;
            padding: 30px;
        }
        h1 { text-align: center; color: #333; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #444; margin-bottom: 8px; }
        input[type="password"], select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }
        input[type="password"]:focus, select:focus { outline: none; border-color: #667eea; }
        .file-upload {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        .file-upload:hover { border-color: #667eea; background: #f0f0ff; }
        .file-upload input[type="file"] { display: none; }
        .preview-img {
            max-width: 100%;
            max-height: 300px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .loading, .error, .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .loading { background: #e3f2fd; color: #1565c0; text-align: center; }
        .error { background: #ffebee; color: #c62828; white-space: pre-wrap; }
        .result { background: #f5f5f5; }
        .result h3 { margin-bottom: 12px; color: #333; }
        .answer {
            line-height: 1.7;
            color: #333;
            font-size: 15px;
            word-wrap: break-word;
        }
        /* 让 KaTeX 公式与文本对齐 */
        .katex { font-size: 1.1em; }
        .hint { font-size: 12px; color: #aaa; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 智谱搜题</h1>
        <p class="subtitle">上传题目图片，AI 帮你详细解答（支持公式渲染）</p>

        <div class="form-group">
            <label>智谱 API Key</label>
            <input type="password" id="apiKey" placeholder="请输入你的智谱清言 API Key" autocomplete="off">
            <p class="hint">Key 仅保存在本地浏览器，不会上传到其他服务器</p>
        </div>

        <div class="form-group">
            <label>选择模型</label>
            <select id="modelSelect">
                <option value="glm-4v-flash" selected>glm-4v-flash（免费，推荐）</option>
                <option value="glm-4v-plus">glm-4v-plus（需开通权限）</option>
            </select>
        </div>

        <div class="form-group">
            <label>题目图片（建议小于 5MB）</label>
            <div class="file-upload" id="fileUpload">
                <p>📷 点击上传图片</p>
                <p style="font-size:12px;color:#999;">支持 JPG、PNG，若图片过大将自动压缩</p>
                <input type="file" id="imageInput" accept="image/*">
            </div>
            <img id="preview" class="preview-img" alt="预览">
        </div>

        <button class="btn" id="submitBtn">🔍 搜题</button>

        <div class="loading" id="loading">⏳ 正在分析题目，请稍候...</div>
        <div class="error" id="error"></div>
        <div class="result" id="result">
            <h3>📝 解答结果</h3>
            <div class="answer" id="answer"></div>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKey');
        const modelSelect = document.getElementById('modelSelect');
        const imageInput = document.getElementById('imageInput');
        const fileUpload = document.getElementById('fileUpload');
        const preview = document.getElementById('preview');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const answerDiv = document.getElementById('answer');

        // 读取本地保存的 Key
        const savedKey = localStorage.getItem('zhipu_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        // 配置 marked（支持换行、GFM）
        marked.setOptions({
            breaks: true,
            gfm: true,
        });

        fileUpload.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', handleFileSelect);

        async function handleFileSelect() {
            const file = imageInput.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    alert('图片超过 5MB，将自动压缩...');
                    try {
                        const compressedDataUrl = await compressImage(file, 1024, 0.7);
                        preview.src = compressedDataUrl;
                        preview.dataset.compressed = compressedDataUrl;
                    } catch (e) {
                        alert('图片压缩失败，请手动上传小于 5MB 的图片');
                        imageInput.value = '';
                        preview.style.display = 'none';
                        return;
                    }
                } else {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        preview.src = e.target.result;
                        preview.dataset.compressed = '';
                    };
                    reader.readAsDataURL(file);
                }
                preview.style.display = 'block';
                hideError();
            }
        }

        function compressImage(file, maxWidth, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        submitBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const model = modelSelect.value;
            const file = imageInput.files[0];

            if (!apiKey) {
                showError('⚠️ 请先填写智谱 API Key');
                return;
            }
            if (!file) {
                showError('⚠️ 请上传题目图片');
                return;
            }

            localStorage.setItem('zhipu_api_key', apiKey);
            submitBtn.disabled = true;
            loading.style.display = 'block';
            hideError();
            resultDiv.style.display = 'none';

            try {
                let imageData;
                if (preview.dataset.compressed) {
                    imageData = preview.dataset.compressed;
                } else {
                    imageData = await readFileAsDataURL(file);
                }

                const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            {
                                role: 'system',
                                content: '你是一个专业的解题助手，擅长识别图片中的题目并给出详细、准确的解答。'
                            },
                            {
                                role: 'user',
                                content: [
                                    {
                                        type: 'text',
                                        text: '请帮我解答这道题。要求：1. 识别题目内容；2. 给出详细的解题步骤；3. 给出最终答案；4. 解释涉及的知识点。如果图片中有多道题，请逐题解答。可以使用 Markdown 格式，数学公式请用 LaTeX 格式（$...$ 或 $$...$$）。'
                                    },
                                    {
                                        type: 'image_url',
                                        image_url: {
                                            url: imageData,
                                            detail: 'auto'
                                        }
                                    }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    let errorMsg = 'API 调用失败';
                    if (data.error) {
                        errorMsg += `\n错误代码：${data.error.code || '未知'}\n错误信息：${data.error.message || JSON.stringify(data.error)}`;
                    } else {
                        errorMsg += `\nHTTP状态码：${response.status}\n完整响应：${JSON.stringify(data)}`;
                    }
                    throw new Error(errorMsg);
                }

                const answer = data.choices?.[0]?.message?.content || '未获取到解答内容';
                renderAnswer(answer);
                resultDiv.style.display = 'block';

            } catch (err) {
                console.error('请求出错:', err);
                let errorMsg = err.message || '未知错误';
                if (err instanceof TypeError && (err.message.includes('Failed to fetch') || err.message.includes('NetworkError'))) {
                    errorMsg = '网络请求失败，可能是浏览器跨域限制（CORS）或网络问题。\n\n建议：\n1. 使用后端代理调用 API\n2. 或使用浏览器插件临时禁用 CORS（不推荐）\n3. 或部署为本地服务器后测试';
                }
                showError('❌ ' + errorMsg);
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function renderAnswer(markdownText) {
            // 1. 用 marked 将 Markdown 转为 HTML
            const html = marked.parse(markdownText);
            answerDiv.innerHTML = html;

            // 2. 使用 KaTeX 自动渲染其中的数学公式
            if (window.renderMathInElement) {
                renderMathInElement(answerDiv, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            } else {
                // 如果 KaTeX 加载失败，保留原始文本
                console.warn('KaTeX 未加载，无法渲染公式');
            }
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (err) => reject(err);
                reader.readAsDataURL(file);
            });
        }

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            errorDiv.style.display = 'none';
        }
    </script>
</body>
</html>

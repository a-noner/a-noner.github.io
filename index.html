<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebLLM 功能测试 - SmolLM2-135M</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 16px; font-size: 13px; }
  h2 { color: #fff; font-size: 14px; margin: 12px 0 6px; }
  #log { background: #000; border: 1px solid #333; padding: 10px; height: 400px; overflow-y: auto;
         white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
  .info  { color: #0f0; }
  .warn  { color: #ff0; }
  .error { color: #f44; }
  .ok    { color: #0ff; font-weight: bold; }
  button { padding: 8px 16px; margin: 6px 6px 6px 0; cursor: pointer;
           background: #222; color: #0f0; border: 1px solid #0f0; font-family: monospace; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #output { background: #000; border: 1px solid #333; padding: 10px; min-height: 60px;
            white-space: pre-wrap; color: #fff; margin-top: 6px; }
</style>
</head>
<body>

<h2>📋 日志</h2>
<div id="log"></div>

<h2>🧪 测试输入</h2>
<textarea id="input" rows="3" style="width:100%;background:#000;color:#0f0;
  border:1px solid #333;padding:8px;font-family:monospace;">请用一句话解释什么是人工智能。</textarea>

<h2>🚀 操作</h2>
<button id="btnRun" disabled>生成</button>
<button id="btnClear">清空日志</button>

<h2>📤 输出</h2>
<div id="output">等待模型加载...</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.84";

const MODEL_ID = "SmolLM2-135M-Instruct-q0f16-MLC";
const logEl   = document.getElementById("log");
const outEl   = document.getElementById("output");
const btnRun  = document.getElementById("btnRun");
const inputEl = document.getElementById("input");

/* ---------- 日志函数：同时写入屏幕和 console ---------- */
function log(msg, type = "info") {
  const time = new Date().toLocaleTimeString();
  const line = `[${time}] ${msg}`;
  const div = document.createElement("div");
  div.className = type;
  div.textContent = line;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  (type === "error" ? console.error : console.log)(line);
}

/* ---------- 捕获全局错误 ---------- */
window.onerror = (msg, src, line, col) => {
  log(`全局错误: ${msg} (${src}:${line}:${col})`, "error");
  return false;
};
window.onunhandledrejection = (e) => {
  log(`未处理的 Promise 拒绝: ${e.reason}`, "error");
};

/* ---------- 检查 WebGPU ---------- */
if (!navigator.gpu) {
  log("❌ 浏览器不支持 WebGPU，无法运行 WebLLM。", "error");
  outEl.textContent = "不支持 WebGPU";
  throw new Error("WebGPU not supported");
}
log("✅ WebGPU 可用。", "ok");

/* ---------- 手动注册模型 ---------- */
const appConfig = {
  model_list: [{
    model: `https://huggingface.co/mlc-ai/${MODEL_ID}`,
    model_id: MODEL_ID,
    model_lib: webllm.modelLibURLPrefix + webllm.modelVersion +
               "/SmolLM2-135M-Instruct-q0f16-ctx2k_cs1k-webgpu.wasm",
  }],
  cacheBackend: "indexeddb",   // 绕开 Cache API 网络错误
};

log(`模型 ID: ${MODEL_ID}`);
log(`model_lib: ${appConfig.model_list[0].model_lib}`);
log("开始创建引擎...");

/* ---------- 创建引擎（带详细日志） ---------- */
async function init() {
  try {
    const engine = await webllm.CreateMLCEngine(MODEL_ID, {
      appConfig,
      logLevel: "INFO",
      initProgressCallback: (report) => {
        const pct = (report.progress * 100).toFixed(1);
        log(`加载进度 ${pct}% | ${report.text}`);
      },
    });

    log("✅ 引擎创建成功，模型就绪。", "ok");
    outEl.textContent = "模型就绪，点击“生成”测试。";
    btnRun.disabled = false;

    /* ---------- 绑定生成按钮 ---------- */
    btnRun.addEventListener("click", async () => {
      const prompt = inputEl.value.trim();
      if (!prompt) { log("输入为空。", "warn"); return; }

      btnRun.disabled = true;
      outEl.textContent = "";
      log(`开始生成，输入: "${prompt}"`);

      let full = "";
      try {
        const reply = await engine.chat.completions.create({
          messages: [
            { role: "system", content: "你是一个简洁的助手，用一句话回答。" },
            { role: "user", content: prompt },
          ],
          temperature: 0.3,
          max_tokens: 128,
          stream: true,
        });

        for await (const chunk of reply) {
          const delta = chunk.choices[0]?.delta?.content || "";
          if (delta) {
            full += delta;
            outEl.textContent = full;
          }
        }
        log("✅ 生成完成。", "ok");
        log(`输出长度: ${full.length} 字符`);
      } catch (err) {
        log(`❌ 生成失败: ${err.message || err}`, "error");
      } finally {
        btnRun.disabled = false;
      }
    });

  } catch (err) {
    log(`❌ 引擎创建失败: ${err.message || err}`, "error");
    log(`错误详情: ${JSON.stringify(err, null, 2)}`, "error");
    outEl.textContent = `加载失败: ${err.message || err}`;
  }
}

document.getElementById("btnClear").addEventListener("click", () => {
  logEl.innerHTML = "";
});

init();
</script>
</body>
</html>
